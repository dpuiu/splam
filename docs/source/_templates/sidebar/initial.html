<script>
    (() => {
        const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");

        const updateSidebarLogos = () => {
            const theme = document.body.dataset.theme;
            const useDarkLogo = theme === "dark" || (theme === "auto" && colorScheme.matches);

            document.querySelectorAll("[data-logo-light][data-logo-dark]").forEach((logo) => {
                logo.src = useDarkLogo ? logo.dataset.logoDark : logo.dataset.logoLight;
            });
        };

        document.addEventListener("DOMContentLoaded", updateSidebarLogos);
        new MutationObserver(updateSidebarLogos).observe(document.body, {
            attributes: true,
            attributeFilter: ["data-theme"],
        });
        colorScheme.addEventListener("change", updateSidebarLogos);
    })();
</script>
